name: Build and deploy application

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_PREFIX: hello-observability-prod

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          apps=$(find app -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "Detected apps: ${apps}"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: gha-app-${{ matrix.app }}-${{ github.run_id }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Ensure ECR repository exists
        env:
          REPO: ${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.app }}
        run: |
          if ! aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$REPO" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi
      - name: Build image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.app }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$REPO:$IMAGE_TAG" "app/${{ matrix.app }}"
          echo "image=$REGISTRY/$REPO" >> "$GITHUB_OUTPUT"
          echo "image_ref=$REGISTRY/$REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Escaneia a imagem localmente antes do push: se houver vulnerabilidade
      # CRITICAL ou HIGH com correção disponível, o job falha e a imagem
      # nunca chega no ECR, então o ArgoCD Image Updater nunca a vê.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.build.outputs.image_ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        env:
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
        run: docker push "$IMAGE_REF"

      # Aplicações já existentes em gitops/apps/<nome> não precisam de mais nada:
      # o ArgoCD Image Updater detecta a nova tag no ECR e atualiza o Kubernetes
      # (e o git, via write-back) automaticamente. Este passo só age quando a
      # pasta gitops/apps/<nome> ainda não existe (aplicação nova).
      - name: Scaffold GitOps manifests for new application
        id: scaffold
        env:
          APP: ${{ matrix.app }}
          IMAGE: ${{ steps.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          DIR="gitops/apps/${APP}"
          if [ -d "$DIR" ]; then
            echo "Application '${APP}' already exists in GitOps; ArgoCD Image Updater handles the rollout."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Application '${APP}' is new. Scaffolding GitOps manifests..."
          mkdir -p "$DIR"

          # Nomes de métrica Prometheus não podem ter hífen; "hello-teste"
          # vira "hello_teste" pro prefixo da métrica <metric>_requests_total.
          METRIC="${APP//-/_}"

          cat > "$DIR/rollout.yaml" <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Rollout
          metadata:
            name: ${APP}
            labels:
              app.kubernetes.io/name: ${APP}
          spec:
            # 2 réplicas para que a divisão canary (setWeight) tenha efeito
            # real: com 1 réplica só, não há como rotear uma fração do
            # tráfego pro canary.
            replicas: 2
            selector:
              matchLabels:
                app.kubernetes.io/name: ${APP}
            strategy:
              canary:
                # Sem trafficRouting: o split de tráfego é aproximado,
                # proporcional à quantidade de pods estável/canary por trás
                # do Service (não é um split exato de porcentagem via ALB).
                steps:
                  - setWeight: 50
                  # Analisa a taxa de sucesso (respostas HTTP 200) só dos
                  # pods do canary via Prometheus. Se ficar abaixo do
                  # successCondition, o Rollout aborta sozinho e volta pro
                  # stable; se passar, promove automaticamente pro próximo
                  # step — sem gate manual. Requer que a aplicação exponha
                  # em /metrics um contador \`<app>_requests_total{code="<n>"}\`.
                  - analysis:
                      templates:
                        - templateName: ${APP}-success-rate
                      args:
                        - name: canary-hash
                          valueFrom:
                            podTemplateHashValue: Latest
                  - setWeight: 100
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: ${APP}
              spec:
                containers:
                  - name: ${APP}
                    image: ${APP}:${IMAGE_TAG}
                    ports:
                      - name: http
                        containerPort: 8080
                    readinessProbe:
                      httpGet: { path: /healthz, port: http }
                    livenessProbe:
                      httpGet: { path: /healthz, port: http }
                    resources:
                      requests: { cpu: 10m, memory: 32Mi }
                      limits: { cpu: 100m, memory: 64Mi }
          EOF

          cat > "$DIR/service.yaml" <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: ${APP}
            labels:
              app.kubernetes.io/name: ${APP}
          spec:
            selector:
              app.kubernetes.io/name: ${APP}
            ports:
              - name: http
                port: 80
                targetPort: http
          EOF

          cat > "$DIR/ingress.yaml" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${APP}
            annotations:
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
          spec:
            ingressClassName: alb
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ${APP}
                          port:
                            name: http
          EOF

          cat > "$DIR/servicemonitor.yaml" <<EOF
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: ${APP}
            labels:
              app.kubernetes.io/name: ${APP}
              # kube-prometheus-stack só descobre ServiceMonitors com este
              # label (release = nome da Application/Helm release "monitoring").
              release: monitoring
          spec:
            selector:
              matchLabels:
                app.kubernetes.io/name: ${APP}
            # Propaga o label que o Argo Rollouts coloca nos pods (identifica
            # canary x stable) pras métricas coletadas, pra o AnalysisTemplate
            # conseguir filtrar só os pods do canary.
            podTargetLabels:
              - rollouts-pod-template-hash
            endpoints:
              - port: http
                path: /metrics
                interval: 15s
          EOF

          cat > "$DIR/analysistemplate.yaml" <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: AnalysisTemplate
          metadata:
            name: ${APP}-success-rate
          spec:
            args:
              # Preenchido automaticamente pelo Rollout com o hash do
              # ReplicaSet canary, pra medir métricas só dos pods novos.
              - name: canary-hash
            metrics:
              - name: success-rate
                # 5 medições de 30s (2m30s no total) antes de decidir.
                count: 5
                interval: 30s
                successCondition: result[0] >= 0.95
                failureLimit: 1
                provider:
                  prometheus:
                    address: http://monitoring-kube-prometheus-prometheus.kube-system.svc:9090
                    query: |
                      (
                        sum(rate(${METRIC}_requests_total{code="200", namespace="${APP}", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
                        /
                        sum(rate(${METRIC}_requests_total{namespace="${APP}", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
                      )
                      OR on() vector(1)
                      # Sem tráfego real na janela, a divisão não retorna série
                      # (den=0) e o "OR on() vector(1)" preenche com 1 (aprova
                      # por padrão). Com tráfego real, prevalece a taxa de
                      # sucesso calculada de fato.
          EOF

          cat > "$DIR/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - rollout.yaml
            - service.yaml
            - ingress.yaml
            - servicemonitor.yaml
            - analysistemplate.yaml
          images:
            - name: ${APP}
              newName: ${IMAGE}
              newTag: ${IMAGE_TAG}
          EOF

          cat > "$DIR/application.yaml" <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${APP}
            namespace: argocd
            annotations:
              argocd-image-updater.argoproj.io/image-list: ${APP}=${IMAGE}
              argocd-image-updater.argoproj.io/${APP}.update-strategy: newest-build
              argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
              argocd-image-updater.argoproj.io/write-back-target: kustomization
              # kustomization.yaml's images[].name is the short alias "${APP}", not the
              # full ECR path used above. Without this, write-back matches by the full
              # image name and appends a second (ineffective) images entry instead of
              # updating the existing one's newTag.
              argocd-image-updater.argoproj.io/${APP}.kustomize.image-name: ${APP}
              argocd-image-updater.argoproj.io/git-branch: main
          spec:
            project: default
            source:
              repoURL: https://github.com/${REPOSITORY}.git
              targetRevision: main
              path: gitops/apps/${APP}
            destination:
              server: https://kubernetes.default.svc
              namespace: ${APP}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
          EOF

          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Commit and open pull request with new application manifests
        if: steps.scaffold.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
          APP: ${{ matrix.app }}
        run: |
          # main is protected (requires PR + review + status checks) and
          # GITOPS_PAT has no bypass, so we can't push straight to main here.
          # Push to a dedicated branch and open a PR for a human to merge.
          BRANCH="automation/scaffold-${APP}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -b "$BRANCH"
          git add "gitops/apps/${APP}"
          git commit -m "feat: scaffold gitops manifests for ${APP}"
          git push origin "$BRANCH"
          gh pr create \
            --title "feat: scaffold gitops manifests for ${APP}" \
            --body "Automatically generated GitOps manifests (Application, Deployment, Service, Ingress, Kustomization) for the new application \`${APP}\`, detected under \`app/${APP}\`. Merge this PR to let ArgoCD create the application and roll out the image already pushed to ECR." \
            --base main \
            --head "$BRANCH"
