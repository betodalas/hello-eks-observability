name: Build and deploy application

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hello-observability-prod/hello-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: github-actions-app-${{ github.sha }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" app
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" gitops/apps/hello-app/kustomization.yaml
      - name: Create GitOps pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-hello-app-image
          base: main
          delete-branch: false
          commit-message: "chore: deploy hello-app ${{ github.sha }}"
          title: "chore: deploy hello-app ${{ github.sha }}"
          body: |
            Update the hello-app GitOps image tag to `${{ github.sha }}`.

            This pull request was created automatically by the application build workflow.
