name: Build and deploy application

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hello-observability-prod/hello-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: github-actions-app-${{ github.sha }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" app
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" gitops/apps/hello-app/kustomization.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gitops/apps/hello-app/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: deploy hello-app ${IMAGE_TAG}"
          git push
