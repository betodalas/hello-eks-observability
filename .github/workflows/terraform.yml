name: Terraform

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - "betodalas-terraform/**"

  plan:
    name: Terraform plan
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: betodalas-terraform/infra/environments/${{ github.base_ref == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.terraform == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: needs.changes.outputs.terraform == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        if: needs.changes.outputs.terraform == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: github-actions-terraform-plan-${{ github.base_ref }}
      - name: Terraform init
        if: needs.changes.outputs.terraform == 'true'
        run: terraform init -backend-config=backend.hcl -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Terraform format check
        if: needs.changes.outputs.terraform == 'true'
        working-directory: betodalas-terraform/infra
        run: terraform fmt -check -recursive
      - name: Terraform validate
        if: needs.changes.outputs.terraform == 'true'
        run: terraform validate
      - name: Terraform plan
        if: needs.changes.outputs.terraform == 'true'
        env:
          TF_VAR_github_repo: ${{ github.repository }}
        run: terraform plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on pull request
        if: needs.changes.outputs.terraform == 'true'
        uses: actions/github-script@v7
        env:
          PLAN_FILE: ${{ github.workspace }}/betodalas-terraform/infra/environments/${{ github.base_ref == 'main' && 'prod' || 'dev' }}/plan.txt
          ENVIRONMENT: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        with:
          script: |
            const fs = require("fs");
            const marker = `<!-- terraform-plan-${process.env.ENVIRONMENT} -->`;
            const plan = fs.existsSync(process.env.PLAN_FILE) ? fs.readFileSync(process.env.PLAN_FILE, "utf8") : "Terraform plan did not produce output.";
            const body = [marker, `## Terraform plan (${process.env.ENVIRONMENT})`, "", "<details><summary>Show plan</summary>", "", "```terraform", plan.length > 60000 ? `${plan.slice(0, 60000)}\n... output truncated` : plan, "```", "", "</details>", "", `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(comment => comment.user.type === "Bot" && comment.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: Upload plan
        if: needs.changes.outputs.terraform == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.base_ref }}-${{ github.run_id }}
          path: betodalas-terraform/infra/environments/${{ github.base_ref == 'main' && 'prod' || 'dev' }}/plan.txt
          retention-days: 7

  apply:
    name: Terraform apply
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: betodalas-terraform/infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: github-actions-terraform-apply-${{ github.ref_name }}
      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Terraform format check
        working-directory: betodalas-terraform/infra
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        env:
          TF_VAR_github_repo: ${{ github.repository }}
        run: terraform plan -out=tfplan
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
