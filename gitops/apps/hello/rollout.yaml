apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello
  labels:
    app.kubernetes.io/name: hello
spec:
  # 2 réplicas para que a divisão canary (setWeight) tenha efeito real:
  # com 1 réplica só, não há como rotear uma fração do tráfego pro canary.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  strategy:
    canary:
      # Sem trafficRouting: o split de tráfego é aproximado, proporcional à
      # quantidade de pods estável/canary por trás do Service (não é um
      # split exato de porcentagem via ALB).
      steps:
        - setWeight: 50
        - pause: { duration: 1m }
        - setWeight: 100
        - pause: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
        - name: hello
          image: hello:eb6002abcbac7d3fda42e6c7631efca36490666f
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
