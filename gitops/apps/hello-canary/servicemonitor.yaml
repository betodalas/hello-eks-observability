apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hello-canary
  labels:
    app.kubernetes.io/name: hello-canary
    # kube-prometheus-stack só descobre ServiceMonitors com este
    # label (release = nome da Application/Helm release "monitoring").
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-canary
  # Propaga o label que o Argo Rollouts coloca nos pods (identifica
  # canary x stable) pras métricas coletadas, pra o AnalysisTemplate
  # conseguir filtrar só os pods do canary.
  podTargetLabels:
    - rollouts-pod-template-hash
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
