apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-roberto
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: hello-roberto=207131866724.dkr.ecr.us-east-1.amazonaws.com/hello-observability-prod/hello-roberto
    argocd-image-updater.argoproj.io/hello-roberto.update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    # kustomization.yaml's images[].name is the short alias "hello-roberto",
    # not the full ECR path used above. Without this, write-back matches by
    # the full image name and appends a second (ineffective) images entry
    # instead of updating the existing one's newTag.
    argocd-image-updater.argoproj.io/hello-roberto.kustomize.image-name: hello-roberto
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/betodalas/hello-eks-observability.git
    targetRevision: main
    path: gitops/apps/hello-roberto
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-roberto
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
