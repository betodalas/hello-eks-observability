apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-roberto
  labels:
    app.kubernetes.io/name: hello-roberto
spec:
  # 2 réplicas para que a divisão canary (setWeight) tenha efeito real:
  # com 1 réplica só, não há como rotear uma fração do tráfego pro canary.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-roberto
  strategy:
    canary:
      # Sem trafficRouting: o split de tráfego é aproximado, proporcional à
      # quantidade de pods estável/canary por trás do Service (não é um
      # split exato de porcentagem via ALB).
      steps:
        - setWeight: 50
        # Analisa a taxa de sucesso (respostas HTTP 200) só dos pods do
        # canary via Prometheus. Se ficar abaixo do successCondition, o
        # Rollout aborta sozinho e volta pro stable; se passar, promove
        # automaticamente pro próximo step — sem gate manual.
        - analysis:
            templates:
              - templateName: hello-roberto-success-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-roberto
    spec:
      containers:
        - name: hello-roberto
          image: hello-roberto:eb6002abcbac7d3fda42e6c7631efca36490666f
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
