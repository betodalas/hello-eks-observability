apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-roberto
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Substitua pelo output `waf_web_acl_arn` do Terraform após o apply (o ARN
    # inclui um ID gerado pela AWS, então não é previsível de antemão).
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:207131866724:regional/webacl/hello-observability-prod-alb/0325b5d8-8f5a-4da3-b214-cdd089fe7f64
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-roberto
                port:
                  name: http
