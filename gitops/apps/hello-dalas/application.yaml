apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-dalas
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: hello-dalas=207131866724.dkr.ecr.us-east-1.amazonaws.com/hello-observability-prod/hello-dalas
    argocd-image-updater.argoproj.io/hello-dalas.update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    # kustomization.yaml's images[].name is the short alias "hello-dalas", not the
    # full ECR path used above. Without this, write-back matches by the full
    # image name and appends a second (ineffective) images entry instead of
    # updating the existing one's newTag.
    argocd-image-updater.argoproj.io/hello-dalas.kustomize.image-name: hello-dalas
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/betodalas/hello-eks-observability.git
    targetRevision: main
    path: gitops/apps/hello-dalas
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-dalas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
