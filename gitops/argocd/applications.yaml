    chart: karpenter-crd
    targetRevision: 1.13.0
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.13.0
    helm:
      values: |
        crds:
          install: false
        settings:
          clusterName: hello-observability-prod
        serviceAccount:
          name: karpenter
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::207131866724:role/hello-observability-prod-karpenter-controller
        controller:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
