apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/betodalas/hello-eks-observability.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      include: '{tools/**/application.yaml,apps/**/application.yaml,argocd/karpenter-repository.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
