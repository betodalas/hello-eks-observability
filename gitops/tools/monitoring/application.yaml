apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 70.4.2
    helm:
      values: |
        grafana:
          enabled: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
            # No hosts set: the chart then emits a single host-less rule
            # matching any Host header, giving Grafana its own ALB (separate
            # from each app's ALB) reachable at "/" on that load balancer's
            # DNS name, same pattern used by app ingresses.
            path: /
            pathType: Prefix
        prometheus:
          prometheusSpec:
            retention: 2h
            resources:
              requests:
                cpu: 30m
                memory: 128Mi
              limits:
                cpu: 150m
                memory: 256Mi
        alertmanager:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The kube-prometheus-stack CRDs (Prometheus, Alertmanager, ThanosRuler,
      # ScrapeConfig) are large enough that client-side apply's
      # last-applied-configuration annotation exceeds etcd's 262144-byte
      # limit, failing the sync. Server-side apply avoids that annotation.
      - ServerSideApply=true
