apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.1
    helm:
      values: |
        serviceAccount:
          create: true
          name: argocd-image-updater
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::207131866724:role/hello-observability-prod-image-updater
        config:
          # Autenticação no ECR via IRSA usando aws ecr get-login-password.
          registries:
            - name: ECR
              prefix: 207131866724.dkr.ecr.us-east-1.amazonaws.com
              api_url: https://207131866724.dkr.ecr.us-east-1.amazonaws.com
              ping: false
              credentials: ext:/scripts/ecr-login.sh
              credsexpire: 10h
        authScripts:
          enabled: true
          scripts:
            ecr-login.sh: |
              #!/bin/sh
              echo -n "AWS:$(aws ecr get-login-password --region us-east-1)"
        extraEnv:
          - name: AWS_REGION
            value: us-east-1
          # readOnlyRootFilesystem=true means /app/.aws is not writable; point the
          # AWS CLI at the writable /tmp emptyDir so ecr-login.sh can run.
          - name: HOME
            value: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# argocd-image-updater v1.x moved to a CRD-based model: the controller no longer
# scans Applications for argocd-image-updater.argoproj.io/* annotations unless an
# ImageUpdater CR tells it to. This CR keeps using the existing annotation-based
# configuration already set on the hello-app Application.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: hello-app
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: hello-app
      useAnnotations: true
